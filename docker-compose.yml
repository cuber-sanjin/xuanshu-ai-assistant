# ===== 玄枢 docker-compose：一键起全栈 =====
# 用法：
#   1. 准备环境变量（.env 或系统环境）：DASHSCOPE_API_KEY 必填
#   2. docker compose up -d --build
#   3. 浏览器访问 http://localhost:8080
#
# 网络：两个服务在同一 compose 网络，frontend 通过服务名 backend 访问
# 数据：SQLite 文件挂到命名卷 xuan_shu_data，重建容器不丢数据
# 密钥：通过 environment 注入，不写入镜像

services:
  backend:
    build: ./backend
    container_name: xuan_shu_backend
    ports:
      - "8000:8000" # 后端直连端口（Swagger/调试用）
    environment:
      # 必填：百炼 API Key（从宿主机环境/根目录 .env 读取）
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:?请设置 DASHSCOPE_API_KEY 环境变量}
      - AI_CHAT_API_KEY=${AI_CHAT_API_KEY:-}
      # 模型配置（可覆盖）
      - LLM_MODEL=${LLM_MODEL:-qwen-plus}
      - EXTRACTOR_MODEL=${EXTRACTOR_MODEL:-qwen-flash}
      - TTS_MODEL=${TTS_MODEL:-qwen3-tts-flash}
      - TTS_VOICE=${TTS_VOICE:-Cherry}
      # 数据库指向持久卷
      - XUANSHU_DB_PATH=/app/data/xuan_shu.db
    volumes:
      - xuan_shu_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: xuan_shu_frontend
    ports:
      - "8080:80" # 用户访问入口（nginx）
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  xuan_shu_data:
