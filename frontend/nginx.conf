# ===== 玄枢前端 nginx 配置 =====
# 两个职责：
#   1. 托管 Vue 构建产物（SPA 路由回退到 index.html）
#   2. 反向代理 /api → 后端服务（容器名 backend，docker-compose 内网互通）
#
# SSE 关键配置（面试点）：
#   - proxy_buffering off：nginx 默认缓冲响应，会把 SSE 攒成整块发出，
#     逐字效果变"一次性输出"；必须关闭
#   - proxy_read_timeout 300s：LLM 长回复 + 工具循环可能超过默认 60s
#   - proxy_set_header Connection ''：HTTP/1.1 长连接（upstream 复用）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：所有未知路径交给前端路由（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 流式：关闭缓冲 + 加长超时 + 连接复用
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection '';
    }

    # 静态资源缓存（带 hash 的文件可长期缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
